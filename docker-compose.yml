version: '3.8'

services:
  api:
    build: .
    container_name: sinhronizuj-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://sinhronizuj_user:${DB_PASSWORD:-sinhronizuj_pass_2026}@db:5432/sinhronizuj_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-1GjlbjEfc1Z8Dus1lWEQsOegDK9iGYNP}@redis:6379/0
    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - ./temp_workspace:/app/temp_workspace
      - .:/app

  worker:
    build: .
    container_name: sinhronizuj-worker
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      - RUNPOD_API_KEY=${RUNPOD_API_KEY}
      - RUNPOD_WHISPER_ID=${RUNPOD_WHISPER_ID}
      - RUNPOD_TRANSLATOR_ID=${RUNPOD_TRANSLATOR_ID}
      - RUNPOD_TTS_ID=${RUNPOD_TTS_ID}
      - DATABASE_URL=postgresql://sinhronizuj_user:${DB_PASSWORD:-sinhronizuj_pass_2026}@db:5432/sinhronizuj_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-1GjlbjEfc1Z8Dus1lWEQsOegDK9iGYNP}@redis:6379/0
    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - ./temp_workspace:/app/temp_workspace
      - .:/app

  beat:
    build: .
    container_name: sinhronizuj-beat
    command: celery -A backend.worker.tasks beat --loglevel=info
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://sinhronizuj_user:${DB_PASSWORD:-sinhronizuj_pass_2026}@db:5432/sinhronizuj_db
      - REDIS_URL=redis://:${REDIS_PASSWORD:-1GjlbjEfc1Z8Dus1lWEQsOegDK9iGYNP}@redis:6379/0
    restart: always
    depends_on:
      - redis
      - db
    volumes:
      - ./temp_workspace:/app/temp_workspace

  redis:
    image: redis:7-alpine
    container_name: sinhronizuj-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"

  db:
    image: postgres:15-alpine
    container_name: sinhronizuj-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sinhronizuj_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sinhronizuj_pass_2026}
      POSTGRES_DB: sinhronizuj_db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
