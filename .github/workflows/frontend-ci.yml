name: Frontend CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Podešavanje Node.js okruženja
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Instalacija zavisnosti
      run: |
        cd frontend
        npm ci

    - name: Pokretanje lintera
      run: |
        cd frontend
        npm run lint

    - name: Pokretanje unit testova (Vitest)
      run: |
        cd frontend
        npm run test

    - name: Instalacija Playwright pretraživača
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Pokretanje E2E testova (Playwright)
      run: |
        cd frontend
        npx playwright test

    - name: Build aplikacije
      run: |
        cd frontend
        npm run build

