name: Frontend CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]
  workflow_call:

jobs:
  frontend-ci:
    name: Frontend Test & Build
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Podešavanje Node.js okruženja
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Instalacija zavisnosti
      run: |
        cd frontend
        npm ci

    - name: Provera zavisnosti na bezbednosne ranjivosti (npm audit)
      run: |
        cd frontend
        npm audit --audit-level=high

    - name: Pokretanje lintera
      run: |
        cd frontend
        npm run lint

    - name: Pokretanje frontend unit testova
      run: cd frontend && npm run test:run

    - name: Instalacija Playwright pretraživača
      run: |
        cd frontend
        npx playwright install --with-deps chromium

    - name: Kreiranje .env fajla za CI okruženje
      run: |
        echo "VITE_API_URL=http://localhost:8000" > frontend/.env

    - name: Pokretanje E2E testova (Playwright)
      run: |
        cd frontend
        npx playwright test
      env:
        CI: true

    - name: Upload Playwright izveštaj pri neuspehu
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 7

    - name: Build aplikacije
      run: |
        cd frontend
        npm run build
