name: Frontend CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Podešavanje Node.js okruženja
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Instalacija zavisnosti
      run: |
        cd frontend
        npm ci

    - name: Pokretanje lintera
      run: |
        cd frontend
        npm run lint

    - name: Build aplikacije
      run: |
        cd frontend
        npm run build
