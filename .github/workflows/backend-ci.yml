name: Backend CI

on:
  push:
    branches: [ development, main ]
  pull_request:
    branches: [ development, main ]
  workflow_call:

jobs:
  backend-ci:
    name: Backend Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Podešavanje Python okruženja
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalacija zavisnosti za testiranje
      run: |
        grep -v -E "torch|demucs" requirements.txt > requirements-ci.txt
        python -m pip install --upgrade pip
        pip install ruff pytest pytest-mock httpx
        pip install -r requirements-ci.txt

    - name: Provera sintakse koda (Ruff Linter)
      run: |
        ruff check --select=E9,F63,F7,F82 backend modal_workers

    - name: Pokretanje Bandit bezbednosnog skenera (SAST)
      run: |
        pip install bandit
        bandit -r backend/ -ll

    - name: Pokretanje integracionih testova
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      run: |
        pip install pytest
        pytest
