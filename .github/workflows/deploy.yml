name: Continuous Deployment (CD)

on:
  push:
    branches: [ development, main ]

jobs:
  deploy-staging:
    name: Deploy na Staging VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/development'

    steps:
    - name: SSH konekcija i ažuriranje kontejnera na Stagingu
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        script: |
          cd /opt/sinhronizuj.me
          echo "Započinjem deployment na Staging za granu: development"
          
          # Osiguravanje da smo na pravoj grani i povlačenje koda
          git checkout development
          git pull origin development
          
          # Pokretanje i re-build Docker kontejnera
          docker compose -f infra/hetzner/docker-compose.prod.yml up -d --build
          # Restart servisa kako bi se učitao novi kod montiran preko volume-a
          docker compose -f infra/hetzner/docker-compose.prod.yml restart

  deploy-production:
    name: Deploy na Produkciju VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: SSH konekcija i ažuriranje kontejnera na Produkciji
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.PROD_VPS_HOST }}
        username: ${{ secrets.PROD_VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.PROD_VPS_PORT || 22 }}
        script: |
          cd /opt/sinhronizuj-me
          echo "Započinjem deployment na Produkciju za granu: main"
          
          # Osiguravanje da smo na pravoj grani i povlačenje koda
          git checkout main
          git pull origin main
          
          # Pokretanje i re-build Docker kontejnera
          docker compose -f infra/hetzner/docker-compose.prod.yml up -d --build
          # Restart servisa kako bi se učitao novi kod montiran preko volume-a
          docker compose -f infra/hetzner/docker-compose.prod.yml restart
