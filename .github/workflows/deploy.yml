name: Deploy Pipeline

on:
  push:
    branches: [ development, main ]

permissions:
  contents: read
  packages: write

jobs:
  backend-test:
    name: Run Backend CI
    uses: ./.github/workflows/backend-ci.yml

  frontend-test:
    name: Run Frontend CI
    uses: ./.github/workflows/frontend-ci.yml

  build-push-images:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: [backend-test]
    steps:
    - name: Preuzimanje koda
      uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata for Docker (API)
      id: meta-api
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-api
        tags: |
          type=ref,event=branch
          type=sha,prefix=

    - name: Extract metadata for Docker (Frontend)
      id: meta-frontend
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}-frontend
        tags: |
          type=ref,event=branch
          type=sha,prefix=

    - name: Build and push Backend Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: true
        tags: ${{ steps.meta-api.outputs.tags }}
        labels: ${{ steps.meta-api.outputs.labels }}

    - name: Build and push Frontend Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        file: ./frontend/Dockerfile
        push: true
        tags: ${{ steps.meta-frontend.outputs.tags }}
        labels: ${{ steps.meta-frontend.outputs.labels }}

  deploy-staging:
    name: Deploy na Staging VPS
    runs-on: ubuntu-latest
    needs: [build-push-images]
    if: github.ref == 'refs/heads/development'

    steps:
    - name: SSH konekcija i ažuriranje kontejnera na Stagingu
      uses: appleboy/ssh-action@v1.0.3
      env:
        GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      with:
        host: ${{ secrets.STAGING_VPS_HOST }}
        username: ${{ secrets.STAGING_VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.STAGING_VPS_PORT || 22 }}
        envs: GHCR_READ_TOKEN
        script: |
          cd /opt/sinhronizuj.me
          echo "Započinjem deployment na Staging za granu: development"
          
          # Osiguravanje da smo na pravoj grani i povlačenje koda
          git checkout development
          git pull origin development
          
          # Login na GHCR na serveru
          if [ ! -z "$GHCR_READ_TOKEN" ]; then
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "Upozorenje: GHCR_READ_TOKEN nije definisan, pokušavam pull bez logovanja..."
          fi
          
          # Pull i pokretanje
          docker compose -f infra/hetzner/docker-compose.prod.yml pull
          docker compose -f infra/hetzner/docker-compose.prod.yml up -d
          
          # Pokretanje migracija
          docker compose -f infra/hetzner/docker-compose.prod.yml exec -T api alembic upgrade head || echo "Nema migracija ili je došlo do greške"

  deploy-production:
    name: Deploy na Produkciju VPS
    runs-on: ubuntu-latest
    needs: [build-push-images]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: SSH konekcija i ažuriranje kontejnera na Produkciji
      uses: appleboy/ssh-action@v1.0.3
      env:
        GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
      with:
        host: ${{ secrets.PROD_VPS_HOST }}
        username: ${{ secrets.PROD_VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.PROD_VPS_PORT || 22 }}
        envs: GHCR_READ_TOKEN
        script: |
          cd /opt/sinhronizuj-me
          echo "Započinjem deployment na Produkciju za granu: main"
          
          # Osiguravanje da smo na pravoj grani i povlačenje koda
          git checkout main
          git pull origin main
          
          # Login na GHCR na serveru
          if [ ! -z "$GHCR_READ_TOKEN" ]; then
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          else
            echo "Upozorenje: GHCR_READ_TOKEN nije definisan, pokušavam pull bez logovanja..."
          fi
          
          # Pull i pokretanje
          docker compose -f infra/hetzner/docker-compose.prod.yml pull
          docker compose -f infra/hetzner/docker-compose.prod.yml up -d
          
          # Pokretanje migracija
          docker compose -f infra/hetzner/docker-compose.prod.yml exec -T api alembic upgrade head || echo "Nema migracija ili je došlo do greške"
