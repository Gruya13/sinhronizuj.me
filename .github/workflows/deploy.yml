name: Continuous Deployment (CD)

on:
  push:
    branches: [ development, main ]

jobs:
  deploy:
    name: Deploy na VPS
    runs-on: ubuntu-latest

    steps:
    - name: SSH konekcija i ažuriranje kontejnera
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd /home/gruya/Projektri/sinhronizuj.me
          
          # Detektovanje grane i povlačenje izmena
          BRANCH=${GITHUB_REF##*/}
          echo "Započinjem deployment za granu: $BRANCH"
          
          git checkout $BRANCH
          git pull origin $BRANCH
          
          # Pokretanje i ponovna izgradnja (build) produkcionih Docker kontejnera
          docker compose -f infra/hetzner/docker-compose.prod.yml up -d --build
