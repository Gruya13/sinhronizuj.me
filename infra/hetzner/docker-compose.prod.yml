version: '3.8'

services:
  # 1. Baza Podataka (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: sinhronizuj-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Portovi su uklonjeni za bolju sigurnost (dostupno samo u Docker mreži)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Redis (Message Broker)
  redis:
    image: redis:7-alpine
    container_name: sinhronizuj-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # Portovi su uklonjeni za bolju sigurnost (dostupno samo u Docker mreži)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: sinhronizuj-minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. FastAPI API Server
  api:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Celery Radnik - Analizator
  worker-analyzer:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-analyzer
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q analyze_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 6. Celery Radnik - Renderer
  worker-renderer:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-renderer
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q render_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Celery Radnik - Default
  worker-default:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-default
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q default_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 8. Celery Beat (Periodični Poslovi)
  beat:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-beat
    command: celery -A backend.worker.tasks beat --loglevel=info
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9. Kontejnerizovani Frontend (React / Nginx)
  frontend:
    image: ghcr.io/gruya13/sinhronizuj.me-frontend:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 10. Prometheus (Sakupljanje metrika)
  prometheus:
    image: prom/prometheus:latest
    container_name: sinhronizuj-prometheus
    restart: always
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 11. Grafana (Vizuelizacija metrika)
  grafana:
    image: grafana/grafana:latest
    container_name: sinhronizuj-grafana
    restart: always
    volumes:
      - ../monitoring/grafana_datasources.yml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3010:3000" # Mapirano na 3010 na hostu da se izbegne konflikt sa Stitch ili lokalnim servisima
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 12. Node Exporter (Metrike sistema)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: sinhronizuj-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 13. cAdvisor (Metrike Docker kontejnera)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sinhronizuj-cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 14. Alertmanager (Upravljanje uzbunama)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: sinhronizuj-alertmanager
    restart: always
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 15. Redis Exporter (Metrike za Redis i Celery redove)
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: sinhronizuj-redis-exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command:
      - '--check-keys=default_queue,analyze_queue,render_queue'
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  alertmanager_data:

