version: '3.8'

services:
  # 1. Baza Podataka (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: sinhronizuj-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Portovi su uklonjeni za bolju sigurnost (dostupno samo u Docker mreži)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 2. Redis (Message Broker)
  redis:
    image: redis:7-alpine
    container_name: sinhronizuj-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    # Portovi su uklonjeni za bolju sigurnost (dostupno samo u Docker mreži)
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 3. MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: sinhronizuj-minio
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. FastAPI API Server
  api:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-api
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 5. Celery Radnik - Analizator
  worker-analyzer:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-analyzer
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q analyze_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 6. Celery Radnik - Renderer
  worker-renderer:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-renderer
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q render_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 7. Celery Radnik - Default
  worker-default:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-worker-default
    command: celery -A backend.worker.tasks worker --loglevel=info --concurrency=1 -Q default_queue
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 8. Celery Beat (Periodični Poslovi)
  beat:
    image: ghcr.io/gruya13/sinhronizuj.me-api:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-beat
    command: celery -A backend.worker.tasks beat --loglevel=info
    env_file:
      - ../../.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ENVIRONMENT=production
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../temp_workspace:/app/temp_workspace
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 9. Kontejnerizovani Frontend (React / Nginx)
  frontend:
    image: ghcr.io/gruya13/sinhronizuj.me-frontend:${IMAGE_TAG:-latest}
    container_name: sinhronizuj-frontend
    ports:
      - "127.0.0.1:3000:80"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  minio_data:
