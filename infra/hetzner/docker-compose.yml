services:
  db:
    image: postgres:16-alpine
    container_name: daca-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-daca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daca_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sinhronizuj_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: daca-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes

  minio:
    image: minio/minio
    container_name: daca-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_pass_2026}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
